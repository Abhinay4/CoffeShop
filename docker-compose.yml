services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coffeeshop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides whatever DATABASE_URL is set to in .env so the app always
      # talks to the "db" service instead of localhost when run via compose.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/coffeeshop
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  # Local DNS resolver for coffeeshop.local -> the LAN IP of this host.
  # NOTE: bound to host port 5300, not the standard 53, because Windows'
  # Internet Connection Sharing service already owns 0.0.0.0:53 on this
  # machine. Only resolvers that let you specify a custom port (e.g. `dig
  # @<host-ip> -p 5300 coffeeshop.local`) can query this - regular OS DNS
  # settings, routers, and browsers cannot target a non-53 port.
  dnsmasq:
    image: 4km3/dnsmasq
    restart: unless-stopped
    ports:
      - "5300:53/udp"
      - "5300:53/tcp"
    cap_add:
      - NET_ADMIN
    command: >
      --address=/coffeeshop.local/192.168.1.12
      --server=8.8.8.8
      --no-daemon

volumes:
  pgdata:
